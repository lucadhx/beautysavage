<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mot de passe oublié - Beauty Savage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="module-panel reset-password-panel">
    <header>
      <h1>Mot de passe oublié</h1>
      <p class="muted">Indiquez l'adresse email liée à votre compte pour recevoir un lien sécurisé.</p>
    </header>
    <form class="reset-password-form" data-reset-request-form>
      <div class="form-group">
        <label for="reset-email">Adresse email</label>
        <input id="reset-email" type="email" autocomplete="email" required>
      </div>
      <p class="form-message" data-reset-request-feedback></p>
      <div class="form-actions">
        <button class="primary-button" type="submit" data-reset-request-submit>Envoyer le lien</button>
      </div>
    </form>
    <p class="muted">
      <a class="secondary-link" href="/login.html">Retour à la page de connexion</a>
    </p>
  </main>
  <script type="module" src="/js/modules/passwordResetRequest.js"></script>
</body>
</html>
