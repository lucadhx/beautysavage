<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>R&#233;initialisation du mot de passe - Beauty Savage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="module-panel reset-password-panel">
    <header>
      <h1>R&#233;initialiser mon mot de passe</h1>
      <p class="muted">Choisissez un nouveau mot de passe s&#233;curis&#233;.</p>
    </header>
    <div class="status-banner" data-reset-status>
      <p class="muted">V&#233;rification du lien en cours...</p>
    </div>
    <form class="reset-password-form" data-reset-form hidden>
      <div class="form-group">
        <label for="new-password">Nouveau mot de passe</label>
        <input id="new-password" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirmer le mot de passe</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <p class="form-message" data-reset-feedback></p>
      <div class="form-actions">
        <button class="primary-button" type="submit" data-reset-submit>Valider</button>
      </div>
    </form>
    <p class="muted">
      <a href="/login.html" class="secondary-link">Retour &#224; la page de connexion</a>
    </p>
  </main>
  <script type="module" src="/js/modules/resetPassword.js"></script>
</body>
</html>
